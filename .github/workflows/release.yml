name: Release

# Build the app for macOS and Windows on hosted runners and attach both to a
# GitHub release.
#
# WHY THIS EXISTS AGAIN. Packaging cannot run on the maintainer's laptop: the
# endpoint policy there kills every ad-hoc-signed native binary electron-builder
# reaches for (app-builder, iconv-corefoundation, …), one approval at a time. A
# hosted runner has none of that, and macOS minutes are free on a public repo.
#
# Signing is OPTIONAL and additive, and mac-only: with no secrets set this
# produces a working UNSIGNED build, which is enough to install and try, and the
# five APPLE_*/CSC_* secrets make the same file sign, notarize and staple.
# Windows is never signed here — that needs its own certificate, bought
# separately from Apple's, so the installer shows a SmartScreen warning on first
# run until you have one.
#
# Fires on a v* tag, or by hand from the Actions tab (dispatch builds but does
# not publish, so you can check a build before cutting a tag).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A Windows failure must not throw away a good mac build, or vice versa.
      fail-fast: false
      matrix:
        include:
          # PINNED, not `macos-latest`. electron-builder 25.1.8 fails the macOS
          # signing dance on the newest runner image: it creates a temporary
          # keychain, imports the .p12, then calls
          #   security set-key-partition-list -S apple-tool:,apple: -s -k <pw>
          # which returns "SecKeychainUnlock: the user name or passphrase you
          # entered is not correct" for a certificate whose password verifies
          # fine locally (openssl says MAC verified OK). The password is not the
          # problem; the image is. macos-14 is the last one this version signs on.
          - os: macos-14
            args: --mac
          - os: windows-2022
            args: --win
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node-gyp (rebuilding node-pty) imports distutils, gone in Python 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade setuptools

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        # The pty end-to-end tests need a real terminal and are environment
        # bound; everything else must pass.
        run: npm run test:focused
        continue-on-error: true

      - name: Compile
        run: npm run build

      - name: Package
        shell: bash
        # An UNSET secret still arrives as an empty string, and electron-builder
        # reads an empty CSC_LINK as a path — which is how an unsigned build died
        # with "/Users/runner/work/atlas/atlas not a file". So clear the signing
        # variables when there is no certificate and tell it not to go hunting
        # for one in the keychain either.
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            echo "no Developer ID certificate in secrets — building unsigned"
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder ${{ matrix.args }} --publish never
        env:
          # MAC ONLY, and that is load-bearing. CSC_LINK is not a mac variable —
          # electron-builder hands it to signtool.exe on Windows too, so leaving
          # it set for the Windows runner signed every .exe with an APPLE
          # Developer ID certificate. Gate each one on the OS.
          #
          # All optional: unset → unsigned build, and the notarize hook no-ops.
          #   CSC_LINK                    base64 of the Developer ID .p12
          #   CSC_KEY_PASSWORD            that .p12's export password
          #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
          #                               notarization, via notarytool
          CSC_LINK: ${{ matrix.os == 'macos-14' && secrets.APPLE_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-14' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-14' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-14' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-14' && secrets.APPLE_TEAM_ID || '' }}

      - name: Checksums
        shell: bash
        run: |
          cd dist
          files=$(ls *.dmg *.zip *.exe 2>/dev/null || true)
          [ -z "$files" ] && { echo "no artifacts"; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum $files > "SHA256SUMS-${{ matrix.os }}.txt"
          else
            shasum -a 256 $files > "SHA256SUMS-${{ matrix.os }}.txt"
          fi
          cat "SHA256SUMS-${{ matrix.os }}.txt"

      # Kept for a dispatch run: the build is downloadable without a release.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-dist
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

      # A tag publishes. `latest-mac.yml` / `latest.yml` and the blockmaps MUST be
      # attached — they are what electron-updater polls; the installers alone give
      # users a download and no updates. Each runner uploads its own files to the
      # same release, which action-gh-release handles idempotently.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
            dist/SHA256SUMS-*.txt
