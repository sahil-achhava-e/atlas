    <!-- Type: the display face is JetBrains Mono at 700 ("Atlas Display" in
         fonts.css), body/UI is Inter, code/terminal JetBrains Mono. The splash
         below paints BEFORE the bundle is parsed, so it can only name faces the
         OS already has — hence the system mono stack, not "Atlas Display".
         v0.4.6: these three faces are BUNDLED (src/renderer/src/design/fonts.css)
         rather than fetched from fonts.googleapis.com, which is blocked in
         mainland China. The CSP above no longer allows either Google font host. -->
    <style>
      /* The splash paints BEFORE the bundle is parsed, so it cannot read the
         design tokens and cannot use the bundled display face. Every value here
         is the literal the tokens resolve to, and both themes are written out
         because there is no JS yet to stamp one on. */
      #cth-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #FFFFFF; color: #111418;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #cth-splash .mk { display: block; width: 56px; height: 56px; }
      #cth-splash .wordmark {
        font-size: 26px; font-weight: 700; letter-spacing: -0.5px; line-height: 1;
      }
      #cth-splash .hint { font-size: 13px; color: #6B7484; }
      /* A quiet progress hairline rather than a spinner: it says the app is
         doing something without pretending to know how far along it is. */
      #cth-splash .bar {
        width: 132px; height: 3px; border-radius: 999px;
        background: #E2E6EC; overflow: hidden;
      }
      #cth-splash .bar i {
        display: block; width: 40%; height: 100%; border-radius: 999px;
        background: #5B3DF5; animation: cth-splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes cth-splash-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(330%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #cth-splash .bar i { animation: none; width: 100%; opacity: 0.5; }
      }
      @media (prefers-color-scheme: dark) {
        #cth-splash { background: #0E1014; color: #F2F4F7; }
        #cth-splash .hint { color: #8E96A5; }
        #cth-splash .bar { background: #262B34; }
        #cth-splash .bar i { background: #8B72FF; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="cth-splash">
        <!-- The same mark the title bar carries, inlined because no bundle has
             loaded yet. Gradient stops are the brand literals. -->
        <svg class="mk" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="cth-splash-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
              <stop stop-color="#5B3DF5" />
              <stop offset="1" stop-color="#4A2FD8" />
            </linearGradient>
            <radialGradient id="cth-splash-sheen" cx="0.3" cy="0.16" r="0.9">
              <stop stop-color="#FFFFFF" stop-opacity="0.28" />
              <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
            </radialGradient>
          </defs>
          <rect width="32" height="32" rx="10" fill="url(#cth-splash-bg)" />
          <rect width="32" height="32" rx="10" fill="url(#cth-splash-sheen)" />
          <path d="M9 24.2 13.2 15.4h5.6L23 24.2h-3.4l-1-2.2h-5.2l-1 2.2H9Z" fill="#FFFFFF" fill-opacity="0.95" />
          <circle cx="16" cy="10.2" r="3.6" fill="#FFFFFF" />
          <circle cx="24.4" cy="7.6" r="1.7" fill="#FFFFFF" fill-opacity="0.55" />
        </svg>
        <div class="wordmark">Atlas</div>
        <div class="bar"><i></i></div>
        <div class="hint">Starting up…</div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
